name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Supersede in-flight runs on a PR branch rather than letting every push queue
# another full matrix.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; no job here needs to write anything.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The PR run already tested this exact tree -- strict status checks
      # require the branch to be current with the default branch before it can
      # merge -- so the post-merge run re-verifies content that just passed.
      # It still runs, to keep the CI badge and a real smoke signal on the
      # default branch, but the matrix collapses to one representative leg.
      matrix:
        rust: ${{ (github.event_name == 'push' && fromJSON('["stable"]')) || fromJSON('["stable","beta"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --all-targets
      - run: cargo test --all-features --doc
      - run: cargo test --no-default-features --features in-memory
      # Reduced feature sets skip doctests: crate-level examples use
      # InMemoryBackend, which is a default feature. Doctests are covered
      # by --all-features above.
      - run: cargo test --no-default-features --lib --tests
      - run: cargo test --no-default-features --features serde --lib --tests
      - run: cargo test --no-default-features --features in-memory,serde
      - run: cargo test --no-default-features --features in-memory,serde,redis-backend

  features:
    name: feature powerset
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack --feature-powerset check --lib --tests

  no-bincode:
    name: bincode absent from the graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 0.6.0 deleted the RUSTSEC-2025-0141 suppression from deny.toml by
      # removing bincode entirely, and 0.7.0 removed the 0.5.x legacy reader.
      # Without this guard a transitive reintroduction would surface as an
      # unexplained cargo-deny failure instead of here.
      #
      # `cargo tree -i` exits non-zero when the package is NOT found, which is
      # the outcome we want -- hence the deliberate inversion.
      - name: cargo tree -i bincode must find nothing
        run: |
          if cargo tree -i bincode --all-features >/dev/null 2>&1; then
            echo "bincode is back in the dependency graph:"
            cargo tree -i bincode --all-features
            exit 1
          fi

  msrv:
    name: msrv (1.85 core / 1.88 backends)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      # Build only: dev-dependencies are allowed to outrun the MSRV.
      # 1.85 covers everything except `redis-backend`.
      - run: cargo build
      - run: cargo build --features in-memory,serde,metrics,tracing,compression,admin-api
      # redis-backend requires 1.88: redis 1.8 declares it, and it also
      # reaches url -> idna -> icu_*. Enforced separately rather than papered
      # over.
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo build --features redis-backend

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features --all-targets -- -D warnings
      # The minimal build has its own lints (cfg-gated code paths).
      - run: cargo clippy --no-default-features --features in-memory -- -D warnings

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true

  unused-deps:
    name: unused dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-machete
      - run: cargo machete

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --no-verify --allow-dirty
      - name: report package size
        run: ls -lh target/package/*.crate

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
